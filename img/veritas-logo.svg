<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" width="180" height="48" role="img" aria-label="Veritas Hospitality Advisors">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@300&amp;display=swap');
    </style>
  </defs>
  <!-- Dark green background pill for nav context -->
  <rect width="180" height="48" fill="#0D1B2A" rx="2"/>
  <!-- Wordmark: "Veritas" in Source Serif 4 weight 300, cream — fallback to Georgia -->
  <text x="12" y="32"
    font-family="'Source Serif 4', Georgia, serif"
    font-weight="300"
    font-size="22"
    letter-spacing="1"
    fill="#f5f4ef">Veritas</text>
  <!-- Gold dot -->
  <text x="130" y="32"
    font-family="'Source Serif 4', Georgia, serif"
    font-weight="300"
    font-size="22"
    fill="#a57426">.</text>
</svg>
